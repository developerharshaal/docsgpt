name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "0"
      ANTHROPIC_API_KEY: "sk-ant-dummy-for-ci"
      API_KEY: "dummy-test-key-for-ci"
    services:
      postgres:
        image: pgvector/pgvector:pg16                  
        env:
          POSTGRES_USER: docsgpt
          POSTGRES_PASSWORD: docsgpt
          POSTGRES_DB: docsgpt_test         
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: psql "postgresql://docsgpt:docsgpt@localhost:5432/docsgpt_test" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        run: ruff check . 

      - name: Run tests
        run: pytest
